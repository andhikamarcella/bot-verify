# Railway Lavalink Configuration
# Deploy this as a separate Railway service

# Server settings for Railway
server:
  port: ${SERVER_PORT:-2333}
  address: 0.0.0.0
  http2:
    enabled: false

spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

# Lavalink server password
lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.17.0"
      snapshot: false
  server:
    password: ${LAVALINK_SERVER_PASSWORD:-youshallnotpass}
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    ws:
      path: "/v4/websocket"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBED
      - WEB_REMIX
      - TVHTML5
      - TVHTML5_EMBED
      - ANDROID
      - IOS

# Buffer settings
bufferDurationMs: 400
bufferedTracks: 3

# Frame buffer settings
frameBufferDurationMs: 5000

# Opus encoder settings
opusEncoding:
  enabled: true
  bitrate: 128000
  sampleRate: 48000
  channels: 2

youtube:
  apiKey: ${YOUTUBE_API_KEY:-""}

# Track loading settings
sourceResolving:
  youtube:
    enabled: true
    searchLimit: 10
    playlistLoadLimit: 100

# GC settings
gc:
  threshold: -1

# Logging
logging:
  level: INFO
  loggers:
    lavalink: INFO
